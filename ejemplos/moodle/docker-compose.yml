version: '3.7'

services:
  mariadb:
    image: bitnami/mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: moodle_password
      TZ: Europe/Madrid
    volumes:
      - mariadb_data:/bitnami/mariadb
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -hmariadb -umoodle -pmoodle_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  moodle:
    image: bitnami/moodle:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # DB
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_PASSWORD: moodle_password
      # Admin Moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: admin_password
      MOODLE_EMAIL: admin@example.com
      # Español por defecto
      MOODLE_SITE_NAME: "Moodle en Español"
      MOODLE_LANGUAGE: es
      # Locales y zona horaria dentro del contenedor
      EXTRA_LOCALES: "es_ES.UTF-8 UTF-8,en_US.UTF-8 UTF-8"
      TZ: Europe/Madrid
      # PHP (tamaños y tiempo)
      PHP_UPLOAD_MAX_FILESIZE: 1024M
      PHP_POST_MAX_SIZE: 1024M
      PHP_MAX_EXECUTION_TIME: 300
    ports:
      - "8080:8080"
    volumes:
      - moodle_app:/bitnami/moodle
      - moodle_data:/bitnami/moodledata

volumes:
  mariadb_data:
    driver: local
  moodle_app:
    driver: local
  moodle_data:
    driver: local
