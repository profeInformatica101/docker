services:
  mariadb:
    image: bitnami/mariadb:11.4.3
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: SuperRoot123!
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: SuperMdl123!
      TZ: Europe/Madrid
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
      ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mariadb_data:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/mariadb/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40

  moodle:
    image: bitnami/moodle:4.4.2
    container_name: moodle
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: "3306"
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_PASSWORD: SuperMdl123!
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: AdminFort3!
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: "Moodle en Español"
      MOODLE_LANGUAGE: es
      EXTRA_LOCALES: "es_ES.UTF-8 UTF-8,en_US.UTF-8 UTF-8"
      TZ: Europe/Madrid
      PHP_UPLOAD_MAX_FILESIZE: 1024M
      PHP_POST_MAX_SIZE: 1024M
      PHP_MAX_EXECUTION_TIME: "300"
    ports:
      - "8080:8080"
    volumes:
      - moodle_app:/bitnami/moodle
      - moodle_data:/bitnami/moodledata

volumes:
  mariadb_data:
  moodle_app:
  moodle_data:
